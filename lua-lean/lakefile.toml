name = "lua-lean"
defaultTargets = ["LuaLean"]

# Lean core only: no dependencies.
[[lean_lib]]
name = "LuaLean"

# test/world.lua lifted and its specs under named axioms (check.sh builds it; a user of the library does not)
[[lean_lib]]
name = "Examples"
globs = ["Examples.+"]

# lua-lean check's Lean side compiled: under `lean --run` a corpus file's calls took minutes (board #70)
[[lean_exe]]
name = "check"
root = "tools.Check"
