# swarm-lean (swarm/lean): check.sh builds it with its proofs and #guard tests, refuses sorry/admit/native_decide and
# any axiom beyond Lean's three (Audit.lean), and runs the Lua CLI's specs against the binary (parity.sh, strict and
# --mixed) and test-claim.sh. The hpl build needs ../high-perf-lean beside the checkout, so it is local only (check.sh
# skips it here). Linux only: the specs read /proc and ps as on Linux.
name: swarm-lean
on:
  push:
    branches: [main]
    paths: [swarm/lean/**, swarm/model/SwarmModel/**, swarm/lua/**, swarm/swarm, swarm/swarm-lua, flake.nix, flake.lock, .github/workflows/swarm-lean.yml]
  pull_request:
    paths: [swarm/lean/**, swarm/model/SwarmModel/**, swarm/lua/**, swarm/swarm, swarm/swarm-lua, flake.nix, flake.lock, .github/workflows/swarm-lean.yml]
  workflow_dispatch:

jobs:
  swarm-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: LuaJIT and its rocks from the repo flake (parity.sh runs the Lua specs)
        run: |
          nix build .#luajit -o "$RUNNER_TEMP/luajit"
          echo "$RUNNER_TEMP/luajit/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('swarm/lean/lean-toolchain') }}
      - name: Lean through elan (lean-toolchain picks the version)
        run: |
          [ -x ~/.elan/bin/elan ] || curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: swarm/lean/.lake
          key: swarm-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('swarm/lean/lean-toolchain') }}-${{ hashFiles('swarm/lean/**/*.lean', 'swarm/lean/c/*', 'swarm/model/SwarmModel/*.lean') }}
          restore-keys: swarm-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('swarm/lean/lean-toolchain') }}-
      - name: check.sh
        run: swarm/lean/check.sh
      - name: the launcher runs the binary
        run: |
          swarm/lean/build.sh
          out=$(SWARM_DB=$RUNNER_TEMP/swarm.db SWARM_NAME=ci swarm/swarm task add launcher-check 2>&1)
          echo "$out"
          [ "$out" = "task #1" ] || { echo "swarm/swarm did not run swarm-lean quietly" >&2; exit 1; }
